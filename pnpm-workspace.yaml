packages:
  - 'apps/*'

autoInstallPeers: true

# Sanity and related packages pinned to avoid pulling in releases that are too
# fresh — these were generated by Sanity's own tooling and should be updated
# when you upgrade Sanity itself.
allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@sanity/access-ui@6.19.0'
  - '@sanity/diff@6.19.0'
  - '@sanity/mutator@6.19.0'
  - '@sanity/schema@6.19.0'
  - '@sanity/types@6.19.0'
  - '@sanity/util@6.19.0'
  - '@sanity/validation@6.19.0'
  - '@sanity/vision@6.19.0'
  - '@tanstack/react-virtual@3.14.18'
  - '@tanstack/virtual-core@3.19.3'
  - framer-motion@14.1.1
  - motion-dom@14.1.1
  - motion-utils@14.1.1
  - motion@14.1.1
  - sanity@6.19.0

# Security overrides for transitive dependencies whose parents pin vulnerable
# versions. Remove an entry once the parent ships the fix itself.
overrides:
  # @oclif/core 4 and eslint-plugin-jsx-a11y-x still ask for minimatch@^10;
  # the ReDoS fix only exists on 11.x — see #39
  'minimatch@>=7.0.0 <11.0.1': ^11.0.5
  # @vercel/frameworks (via @sanity/cli) pins js-yaml@3.13.1 — see #37
  '@vercel/frameworks>js-yaml': ^3.15.2
