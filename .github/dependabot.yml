# NOTE: For high-severity CVEs, enable "Dependabot security updates" in GitHub:
# Settings → Security → Code security and analysis → Dependabot security updates
# This reacts to new advisories immediately, independent of the schedule below.

version: 2
updates:
  # pnpm workspace (root + apps/web + apps/studio).
  # One entry at the root so Dependabot updates the shared root
  # pnpm-lock.yaml; per-app entries cannot update it and break
  # `pnpm install --frozen-lockfile` in CI.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "06:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
