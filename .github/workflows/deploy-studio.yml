name: Deploy Studio

# Deploys the hosted Sanity Studio (apps/studio) whenever Studio code or
# dependencies change on main. The website is deployed by Cloudflare Pages,
# not by this workflow.
on:
  push:
    branches: [main]
    paths:
      - 'apps/studio/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-studio.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits instead of cancelling a running deploy.
concurrency:
  group: deploy-studio
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Sanity Studio
    runs-on: ubuntu-latest
    env:
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
    steps:
      - name: Check for SANITY_AUTH_TOKEN
        run: |
          if [ -z "$SANITY_AUTH_TOKEN" ]; then
            echo "::error title=Missing secret::SANITY_AUTH_TOKEN is not set. Create a Sanity API token with the 'Deploy Studio' permission and add it as a repository secret named SANITY_AUTH_TOKEN (see apps/studio/README.md)."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Studio
        # --yes runs unattended; the target app comes from deployment.appId in sanity.cli.ts.
        run: pnpm --filter studio exec sanity deploy --yes
